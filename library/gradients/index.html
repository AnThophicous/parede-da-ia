<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca de blurs — parede-da-ia</title>
  <link rel="stylesheet" href="blur-library.css">
  <style>
    :root { color-scheme: dark; --bg: #050816; --fg: #f4efe6; --muted: #8e97bd; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px clamp(16px, 4vw, 64px); background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 5vw, 56px); font-weight: 500; letter-spacing: -0.03em; }
    p { margin: 0 0 32px; color: var(--muted); max-width: 60ch; }
    .palettes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }
    .palettes button { font: inherit; color: var(--fg); background: transparent; border: 1px solid rgb(255 255 255 / .18); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
    .palettes button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 40px 32px; }
    figure { margin: 0; text-align: center; }
    .swatch { aspect-ratio: 1; border-radius: 50%; }
    figcaption { margin-top: 14px; font-size: 14px; letter-spacing: .02em; }
    code { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <h1>Biblioteca de blurs</h1>
  <p>12 tipos de gradiente, agnósticos de paleta (variáveis <code>--c1…--c4</code>), interpolados em OKLab/OKLCH e com grão. Troque a paleta para ver o mesmo sistema em direções diferentes.</p>
  <div class="palettes" role="group" aria-label="Paletas">
    <button aria-pressed="true" data-p="#050816,#1b2a63,#ff6a1a,#ffb36b">Meia-noite + laranja</button>
    <button aria-pressed="false" data-p="#0d0f0a,#3d4a35,#d89a4a,#e8c79a">Oliva + âmbar</button>
    <button aria-pressed="false" data-p="#1a0b3b,#4f2bff,#ff4fa3,#00e0c6">Vívida</button>
    <button aria-pressed="false" data-p="#000000,#2e2e2e,#9a9a9a,#ffffff">Monocromática</button>
  </div>
  <div class="grid" id="grid"></div>
  <script>
    const types = [
      ['irregular', 'Irregular'], ['radial-ramp', 'Radial Ramp'], ['blurred', 'Blurred'], ['edgy', 'Edgy'],
      ['landscape', 'Landscape'], ['multicolor', 'Multicolor'], ['retro', 'Retro'], ['duotone', 'Duotone'],
      ['tricolor', 'Tricolor'], ['volume-mesh', 'Volume Mesh'], ['banding', 'Banding Gradient'], ['drift', 'Irregular animado'],
    ];
    const grid = document.getElementById('grid');
    grid.innerHTML = types.map(([id, name]) => `<figure><div class="blur swatch blur--${id === 'drift' ? 'irregular blur--drift' : id}"></div><figcaption>${name}<br><code>.blur--${id}</code></figcaption></figure>`).join('');
    const apply = (list) => {
      const [c1, c2, c3, c4] = list.split(',');
      for (const el of grid.querySelectorAll('.blur')) {
        el.style.setProperty('--c1', c1);
        el.style.setProperty('--c2', c2);
        el.style.setProperty('--c3', c3);
        el.style.setProperty('--c4', c4);
      }
    };
    document.querySelectorAll('.palettes button').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('.palettes button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      apply(b.dataset.p);
    }));
    apply(document.querySelector('.palettes button').dataset.p);
  </script>
</body>
</html>
